<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Mỹ phẩm Hồng Diễm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #F7F1EE;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 400px;
            padding: 30px;
            background: #fff;
        }

        .btn-submit {
            background-color: #A37055;
            color: white;
            border-radius: 50px;
            border: none;
        }

            .btn-submit:hover {
                background-color: #85563B;
                color: white;
            }
    </style>
</head>
<body>
    <div class="card">
        <h3 class="text-center mb-4" style="color: #A37055; font-weight: bold;">ĐĂNG NHẬP</h3>
        <form onsubmit="return xuLyDangNhap(event)">
            <div class="mb-3">
                <label class="form-label fw-bold" style="color: #555;">Email</label>
                <input type="email" id="txtEmail" class="form-control" placeholder="admin@gmail.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold" style="color: #555;">Mật khẩu</label>
                <input type="password" id="txtPassword" class="form-control" placeholder="Nhập mật khẩu..." required>
            </div>
            <button type="submit" class="btn btn-submit w-100 py-2">Đăng Nhập</button>
        </form>

        <script>
            function xuLyDangNhap(e) {
                e.preventDefault();
                var email = document.getElementById("txtEmail").value;
                var password = document.getElementById("txtPassword").value;

                // Kiểm tra nếu đúng tài khoản admin
                if (email === "admin@gmail.com" && password === "123456") {
                    // Lưu trạng thái đăng nhập vào trình duyệt
                    sessionStorage.setItem("userRole", "admin");
                    alert("Đăng nhập tài khoản Admin thành công!");
                    window.location.href = "/"; // Quay về trang chủ
                } else {
                    alert("Đăng nhập thành công với tài khoản khách!");
                    sessionStorage.setItem("userRole", "guest");
                    window.location.href = "/";
                }
                return false;
            }
        </script>
        <p class="text-center mt-3 mb-0">Chưa có tài khoản? <a href="/pages/register.html" style="color: #A37055; text-decoration: none;">Đăng ký ngay</a></p>
    </div>
</body>
</html>
