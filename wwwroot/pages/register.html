<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - Mỹ phẩm Hồng Diễm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #F7F1EE;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 400px;
            padding: 30px;
            background: #fff;
        }

        .btn-submit {
            background-color: #A37055;
            color: white;
            border-radius: 50px;
            border: none;
        }

            .btn-submit:hover {
                background-color: #85563B;
                color: white;
            }
    </style>
</head>
<body>
    <div class="card">
        <h3 class="text-center mb-4" style="color: #A37055; font-weight: bold;">ĐĂNG KÝ</h3>
        <form onsubmit="alert('Đăng ký thành công!'); window.location.href='/pages/login.html'; return false;">
            <div class="mb-3">
                <label class="form-label fw-bold" style="color: #555;">Họ và tên</label>
                <input type="text" class="form-control" placeholder="Nhập họ tên..." required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold" style="color: #555;">Email</label>
                <input type="email" class="form-control" placeholder="example@gmail.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold" style="color: #555;">Mật khẩu</label>
                <input type="password" class="form-control" placeholder="Nhập mật khẩu..." required>
            </div>
            <button type="submit" class="btn btn-submit w-100 py-2">Đăng Ký</button>
        </form>
        <p class="text-center mt-3 mb-0">Đã có tài khoản? <a href="/pages/login.html" style="color: #A37055; text-decoration: none;">Đăng nhập</a></p>
    </div>
</body>
</html>
